name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build tests/ClaudeDocumentIntelligence.Tests --configuration Release
      - name: Test
        run: dotnet test tests/ClaudeDocumentIntelligence.Tests --configuration Release --no-build --verbosity normal
